<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swadeshi Disaster - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; margin-top: 0; }
        .refresh-btn { background: #0275d8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #d9534f; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .badge { background: #ffc107; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="refresh-btn" onclick="fetchAlerts()">🔄 Manual Refresh</button>
    <h2>🇮🇳 Control Room - Live Emergency Alerts</h2>
    <p>Real-time incident feed from public reporting system</p>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Time</th>
                <th>Name</th>
                <th>Location</th>
                <th>Disaster</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody id="alertsTableBody">
            <!-- Data will load dynamically -->
        </tbody>
    </table>
</div>

<script>
    async function fetchAlerts() {
        const tableBody = document.getElementById('alertsTableBody');

        try {
            const response = await fetch('https://my-disaster-app.onrender.com/api/reports');
            const reports = await response.json();

            tableBody.innerHTML = '';

            if (reports.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No Emergency Alerts Found</td></tr>';
                return;
            }

            reports.slice().reverse().forEach(report => {
                const row = `
                    <tr>
                        <td><b>#${report.id}</b></td>
                        <td>${report.time}</td>
                        <td>${report.name}</td>
                        <td><b>${report.location}</b></td>
                        <td><span class="badge">${report.disasterType}</span></td>
                        <td>${report.details || 'N/A'}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        } catch (error) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Backend Server Not Connected!</td></tr>';
        }
    }

    fetchAlerts();
    setInterval(fetchAlerts, 3000); // Auto-refresh every 3 seconds
</script>

</body>
</html>
