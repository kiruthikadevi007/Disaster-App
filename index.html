<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swadeshi Disaster Alert Portal</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        /* Continuous Live Marquee Ticker */
        .ticker-wrap {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(225, 29, 72, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(225, 29, 72, 0.4);
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            z-index: 100;
        }

        .ticker {
            display: inline-block;
            animation: marquee 20s linear infinite;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            color: #fecdd3;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Glassmorphism Main Card */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 520px;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Animated Siren Light Indicator */
        .siren-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: #fb7185;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #f43f5e;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(244, 63, 94, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        option {
            background-color: #0f172a;
            color: #fff;
        }

        /* GPS Location Button */
        .gps-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gps-btn:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* Map Container */
        #map {
            height: 180px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Glowing Animated Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(225, 29, 72, 0.6);
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        }

        #responseMsg {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Top Live Ticker -->
    <div class="ticker-wrap">
        <div class="ticker">
            🚨 SWADESHI DISASTER ALERT PORTAL • REAL-TIME EMERGENCY MONITORING ENABLED • STAY SAFE 🚨
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="siren-badge">
                <div class="pulse-dot"></div>
                Live Alert System
            </div>
            <h2>Swadeshi Disaster Control</h2>
            <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Atmanirbhar Bharat Emergency Response</p>
        </div>

        <form id="disasterForm">
            <div class="form-group">
                <label>Your Name (Unga Peyar):</label>
                <input type="text" id="name" required placeholder="Ex: Rahul">
            </div>

            <div class="form-group">
                <label>Location (Aapathu Edam):</label>
                <div class="input-group">
                    <input type="text" id="location" required placeholder="Ex: Chennai, Velachery">
                    <button type="button" class="gps-btn" onclick="detectLocation()">📍 Detect GPS</button>
                </div>
                <!-- Interactive Leaflet Map -->
                <div id="map"></div>
            </div>

            <div class="form-group">
                <label>Disaster Type (Vagai):</label>
                <select id="type" required>
                    <option value="">--> Select Type <--</option>
                    <option value="Flood">Flood (Vellam)</option>
                    <option value="Cyclone">Cyclone (Puyal)</option>
                    <option value="Fire">Fire (Thee Abathu)</option>
                    <option value="Landslide">Landslide (Man Sarivu)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Details (Vivaram):</label>
                <textarea id="details" rows="3" placeholder="Explain the situation..."></textarea>
            </div>

            <button type="submit" class="submit-btn">🚨 Send Emergency Alert</button>
        </form>

        <div id="responseMsg"></div>
    </div>

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Map Initialization (Default centered at Tamil Nadu/India)
        const map = L.map('map').setView([13.0827, 80.2707], 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([13.0827, 80.2707]).addTo(map)
            .bindPopup('Swadeshi Location Monitoring')
            .openPopup();

        // Detect My Location (GPS Logic)
        function detectLocation() {
            const locationInput = document.getElementById('location');
            
            if ("geolocation" in navigator) {
                locationInput.value = "Fetching GPS location...";
                
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // Update Map View & Marker
                    map.setView([lat, lon], 15);
                    marker.setLatLng([lat, lon])
                          .bindPopup("📍 Detected Emergency Location")
                          .openPopup();

                    // Reverse Geocoding via OpenStreetMap API (Convert Lat/Lon to City Name)
                    try {
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                        const geoData = await geoRes.json();
                        
                        const city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.suburb || "Detected Location";
                        const state = geoData.address.state || "";
                        
                        locationInput.value = `${city}, ${state} (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                    } catch (e) {
                        locationInput.value = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                    }

                }, function(error) {
                    alert("GPS Access Denied or Unavailable! Please type manually.");
                    locationInput.value = "";
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        // Emergency Beep Synthesizer
        function playEmergencyBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(900, audioCtx.currentTime);
            gain1.gain.setValueAtTime(0.3, audioCtx.currentTime); 
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(audioCtx.currentTime);
            osc1.stop(audioCtx.currentTime + 0.15);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1300, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + 0.2);
            }, 180);
        }

        // Form Submission Logic
        document.getElementById('disasterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const alertData = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                disasterType: document.getElementById('type').value,
                details: document.getElementById('details').value
            };

            const responseMsg = document.getElementById('responseMsg');
            responseMsg.style.background = "rgba(56, 189, 248, 0.1)";
            responseMsg.style.color = "#38bdf8";
            responseMsg.innerText = "Sending alert to Swadeshi Control Room...";

            try {
                const response = await fetch('https://my-disaster-app.onrender.com/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(alertData)
                });

                const result = await response.json();

                if (response.ok) {
                    responseMsg.style.background = "rgba(34, 197, 94, 0.15)";
                    responseMsg.style.color = '#4ade80';
                    responseMsg.innerText = "✅ " + result.message;
                    document.getElementById('disasterForm').reset();
                    playEmergencyBeep();
                } else {
                    responseMsg.style.background = "rgba(239, 68, 68, 0.15)";
                    responseMsg.style.color = '#f87171';
                    responseMsg.innerText = "❌ Alert send panna mudiyala!";
                }
            } catch (error) {
                responseMsg.style.background = "rgba(239, 68, 68, 0.15)";
                responseMsg.style.color = '#f87171';
                responseMsg.innerText = "❌ Backend Server Connect Aagala!";
            }
        });
    </script>
</body>
</html>
